AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram Mukham Service on ECS'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  CPU:
    Type: Number
    Default: 512
  Memory:
    Type: Number
    Default: 1024
  MukhamPort:
    Type: Number
    Default: 3000
  ImageTag:
    Type: String
    Default: latest
  NodeEnv:
    Type: String
    Default: production
    AllowedValues: [development, production]
  VpcId:
    Type: String
    Description: VPC ID where resources will be deployed
  PublicSubnet1Id:
    Type: String
    Description: Public Subnet 1 ID for ALB
  PublicSubnet2Id:
    Type: String
    Description: Public Subnet 2 ID for ALB
  PrivateSubnet1Id:
    Type: String
    Description: Private Subnet 1 ID for ECS tasks
  PrivateSubnet2Id:
    Type: String
    Description: Private Subnet 2 ID for ECS tasks
  ECSClusterName:
    Type: String
    Description: Name of the existing ECS cluster
    Default: sutram-dev-cluster
  ECSTaskExecutionRoleArn:
    Type: String
    Description: ARN of the existing ECS Task Execution Role (optional)
    Default: ""
  ECSTaskRoleArn:
    Type: String
    Description: ARN of the existing ECS Task Role (optional)
    Default: ""

Resources:

  # ECS Task Execution Role (conditional)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskExecutionRole
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ecs-execution-role"

  # ECS Task Role (conditional)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskRole
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ecs-task-role"

  # ECS Security Group
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref MukhamPort
          ToPort: !Ref MukhamPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ecs-sg"

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-mukham-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-mukham-alb"

  # Security Group for ALB
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Mukham Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-mukham-alb-sg"

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-mukham-tg"
      Port: !Ref MukhamPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30

  # Listener
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-${Environment}-mukham"
      RetentionInDays: !If [IsProd, 30, 7]

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-${Environment}-mukham"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CPU
      Memory: !Ref Memory
      ExecutionRoleArn: !If [CreateTaskExecutionRole, !GetAtt ECSTaskExecutionRole.Arn, !Ref ECSTaskExecutionRoleArn]
      TaskRoleArn: !If [CreateTaskRole, !GetAtt ECSTaskRole.Arn, !Ref ECSTaskRoleArn]
      ContainerDefinitions:
        - Name: mukham
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-mukham:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref MukhamPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: !Ref NodeEnv
            - Name: PORT
              Value: !Ref MukhamPort
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: NEXT_PUBLIC_API_URL
              Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
            - Name: NEXTAUTH_SECRET
              Value: !Sub "${ProjectName}-${Environment}-nextauth-secret-change-me"
            - Name: NEXTAUTH_URL
              Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ECS Service
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${ProjectName}-${Environment}-mukham"
      Cluster: !Ref ECSClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [IsProd, 2, 1]
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: mukham
          ContainerPort: !Ref MukhamPort
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          AssignPublicIp: DISABLED
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-mukham"
        - Key: Environment
          Value: !Ref Environment

Conditions:
  CreateTaskExecutionRole: !Equals [!Ref ECSTaskExecutionRoleArn, ""]
  CreateTaskRole: !Equals [!Ref ECSTaskRoleArn, ""]
  IsProd: !Equals [!Ref Environment, prod]

Outputs:
  LoadBalancerDNS:
    Description: Mukham Application Load Balancer DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-mukham-alb-dns"

  LoadBalancerURL:
    Description: Mukham Application Load Balancer URL
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  ServiceArn:
    Description: ECS Service ARN
    Value: !Ref Service
    Export:
      Name: !Sub "${ProjectName}-${Environment}-mukham-service-arn"

  TaskDefinitionArn:
    Description: ECS Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub "${ProjectName}-${Environment}-mukham-task-definition-arn"
