name: Deploy Mukham Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      image_tag:
        description: 'Image tag for mukham service (optional, defaults to latest)'
        required: false
        type: string
        default: 'latest'

env:
  AWS_REGION: ap-south-1

jobs:
  mukham-dev:
    name: Deploy Mukham to Dev
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'dev'
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Mukham to Dev
        run: |
          cd aws
          chmod +x scripts/*.sh
          ./scripts/mukham.sh dev ${{ github.event.inputs.image_tag }}
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  mukham-prod:
    name: Deploy Mukham to Prod
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod'
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Mukham to Prod
        run: |
          cd aws
          chmod +x scripts/*.sh
          ./scripts/mukham.sh prod ${{ github.event.inputs.image_tag }}
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
