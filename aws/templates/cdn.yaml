AWSTemplateFormatVersion: '2010-09-09'
Description: 'Sutram CDN with CloudFront - Domain: sutram.co'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ProjectName:
    Type: String
    Default: sutram
  BaseDomainName:
    Type: String
    Default: sutram.co
    Description: Base domain name (e.g., sutram.co)
  CertificateArn:
    Type: String
    Description: ARN of the SSL certificate for the domain (must be in us-east-1 for CloudFront)
    Default: ""
  ExistingHostedZoneId:
    Type: String
    Default: ""
    Description: Existing Route 53 Hosted Zone ID (leave empty to create new)

Resources:
  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasCustomCertificate
          - !If
            - IsProd
            - - !Ref BaseDomainName
              - !Sub "www.${BaseDomainName}"
              - !Sub "mukham.${BaseDomainName}"
            - - !Sub "dev.${BaseDomainName}"
              - !Sub "mukham.dev.${BaseDomainName}"
          - !Ref "AWS::NoValue"
        Comment: !Sub "${ProjectName} ${Environment} CDN"
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        
        # Default Origin - Points to Mukham ECS
        Origins:
          - Id: mukham-ecs-origin
            DomainName:
              Fn::ImportValue: !Sub "${ProjectName}-${Environment}-mukham-alb-dns"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
          - Id: web-api-origin
            DomainName: !Sub "web.${BaseDomainName}"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2

        # Default Cache Behavior - Points to Mukham ECS
        DefaultCacheBehavior:
          TargetOriginId: mukham-ecs-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy

        # Additional Cache Behaviors
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: web-api-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # SecurityHeadersPolicy

        # Custom Error Pages
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300

        # SSL Certificate Configuration
        ViewerCertificate: !If
          - HasCustomCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # Logging Configuration
        Logging:
          Bucket: !Sub "${LoggingBucket}.s3.amazonaws.com"
          IncludeCookies: false
          Prefix: !Sub "cloudfront-logs/${Environment}/"

      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-cdn"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName

  # S3 Bucket for CloudFront Logs
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-cloudfront-logs-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: true
        IgnorePublicAcls: false
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteLogsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-cloudfront-logs"
        - Key: Environment
          Value: !Ref Environment

  # Route 53 Hosted Zone (if needed)
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateHostedZone
    Properties:
      Name: !Ref BaseDomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${BaseDomainName}"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-hosted-zone"
        - Key: Environment
          Value: !Ref Environment

  # Route 53 Records for Production
  ProdAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomCertificateAndProd
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref ExistingHostedZoneId
      Name: !Ref BaseDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID

  WWWProdAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomCertificateAndProd
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref ExistingHostedZoneId
      Name: !Sub "www.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID

  # Route 53 Records for Development
  DevAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomCertificateAndDev
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref ExistingHostedZoneId
      Name: !Sub "dev.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID

  # Route 53 Records for Mukham subdomain - Production
  MukhamProdAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomCertificateAndProd
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref ExistingHostedZoneId
      Name: !Sub "mukham.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID

  # Route 53 Records for Mukham subdomain - Development
  MukhamDevAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomCertificateAndDev
    Properties:
      HostedZoneId: !If
        - CreateHostedZone
        - !Ref HostedZone
        - !Ref ExistingHostedZoneId
      Name: !Sub "mukham.dev.${BaseDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID

Conditions:
  HasCustomCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  IsProd: !Equals [!Ref Environment, prod]
  IsDev: !Equals [!Ref Environment, dev]
  HasCustomCertificateAndProd: !And [!Condition HasCustomCertificate, !Condition IsProd]
  HasCustomCertificateAndDev: !And [!Condition HasCustomCertificate, !Condition IsDev]
  CreateHostedZone: !And
    - !Condition HasCustomCertificate
    - !Equals [!Ref ExistingHostedZoneId, ""]

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cloudfront-distribution-id"

  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cloudfront-domain-name"

  CloudFrontURL:
    Description: CloudFront Distribution URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  CustomDomainURL:
    Condition: HasCustomCertificate
    Description: Custom Domain URL
    Value: !If
      - IsProd
      - !Sub "https://${BaseDomainName}"
      - !Sub "https://dev.${BaseDomainName}"

  MukhamSubdomainURL:
    Condition: HasCustomCertificate
    Description: Mukham Subdomain URL
    Value: !If
      - IsProd
      - !Sub "https://mukham.${BaseDomainName}"
      - !Sub "https://mukham.dev.${BaseDomainName}"

  HostedZoneId:
    Condition: CreateHostedZone
    Description: Route 53 Hosted Zone ID
    Value: !Ref HostedZone
    Export:
      Name: !Sub "${ProjectName}-${Environment}-hosted-zone-id"

  LoggingBucket:
    Description: S3 Bucket for CloudFront Logs
    Value: !Ref LoggingBucket
    Export:
      Name: !Sub "${ProjectName}-${Environment}-cloudfront-logs-bucket"
